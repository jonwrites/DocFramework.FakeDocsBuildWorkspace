name: Test contributor artifact access

on:
  workflow_dispatch:

jobs:
  test-access:
    runs-on: ubuntu-latest

    steps:
      - name: Find Storage documentation artifact
        run: |
          curl -fL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_ACTIONS_PAT }}" \
            "https://api.github.com/repos/jonwrites/DocFramework.FakeConsumer1/actions/artifacts?name=documentation-input" \
            -o artifacts.json

          cat artifacts.json

      - name: Download Storage documentation artifact
        run: |
          ARTIFACT_URL=$(python -c "import json; print(json.load(open('artifacts.json'))['artifacts'][0]['archive_download_url'])")

          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_ACTIONS_PAT }}" \
            "$ARTIFACT_URL" \
            -o storage-artifact.zip

      - name: Inspect downloaded artifact
        run: |
          file storage-artifact.zip
          unzip -l storage-artifact.zip