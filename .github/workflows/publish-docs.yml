name: Aggregate Documentation

on:
  workflow_dispatch:

env:
  DOC_VERSION: v1.0.0


permissions:
  contents: read

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Install yq
        run: |
          sudo snap install yq

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Create workspace
        run: |
          mkdir -p workspace/artifacts
          mkdir -p workspace/docs
          mkdir -p workspace/contributors

      - name: Copy DocFX configuration
        run: cp docfx.json workspace/docfx.json

      - name: Retrieve contributor documentation
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: |
          contributors=$(yq -r '.contributors[] | [.name, .repository, .docs-path] | @tsv' uop.yml)

          while IFS=$'\t' read -r name repository docs_path
          do
            echo "=========================================="
            echo "Processing: $name"
            echo "Repository: $repository"
            echo "Docs path: $docs_path"
            echo "=========================================="

            mkdir -p "workspace/docs/$docs_path"
            mkdir workspace/contributors/$docs_path/

            echo "Finding documentation artifact..."

            curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repository/actions/artifacts?name=documentation-input" \
              -o artifact-list.json

            artifact_url=$(python -c "
          import json
          data = json.load(open('artifact-list.json'))
          artifacts = [a for a in data['artifacts'] if not a['expired']]
          artifacts.sort(key=lambda a: a['created_at'], reverse=True)
          print(artifacts[0]['archive_download_url'])
          ")

            echo "Downloading artifact..."

            curl -fL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$artifact_url" \
              -o contributor.zip

            echo "Unpacking artifact..."

            rm -rf contributor
            mkdir contributor

            unzip -q contributor.zip -d contributor

            echo "===== CONTRIBUTOR ARTIFACT ====="
            find contributor -type f | sort

            echo "Copying API artifacts..."

            cp contributor/artifacts/* \
               workspace/artifacts/

            echo "Copying human documentation..."

            cp -r contributor/docs/* \
               "workspace/docs/$docs_path/"

            echo "Copying contributor metadata..."

            cp -r contributor/manifest.yml \
               "workspace/contributors/$docs_path/"

            echo "Finished $name"

          done <<< "$contributors"

      - name: Create UOP landing page
        run: |
          cat > workspace/index.md <<'EOF'
          # JLib Services version ${{ env.DOC_VERSION }}

          Documentation for the JLib Services documentation unit.
          EOF

      - name: Create UOP table of contents
        run: |
          cat > workspace/toc.yml <<'EOF'
          - name: JLib Services Docs
            href: docs/index.md

          - name: API
            href: api/
          EOF

      - name: Create human docs landing page
        run: |
          cat > workspace/docs/index.md <<'EOF'
          # Document sets

          - [Storage](storage/index.md)
          - [Messaging](messaging/index.md)
          EOF

      - name: Create human docs table of contents
        run: |
          cat > workspace/docs/toc.yml <<'EOF'
          - name: JLib Services
            href: index.md

          - name: Storage
            href: storage/index.md

          - name: Messaging
            href: messaging/index.md

          - name: API
            href: ../api/
          EOF

      - name: Inspect documentation workspace
        run: |
          echo "===== WORKSPACE ====="
          find workspace -type f | sort

          echo
          echo "===== MANIFESTS ====="
          find workspace/*/ -name "manifest.yml" -print -exec cat {} \;

          echo
          echo "===== DOCFX CONFIG ====="
          cat workspace/docfx.json

      - name: Generate API metadata
        working-directory: workspace
        run: docfx metadata docfx.json

      - name: Show workspace after metadata generation
        run: |
          echo "===== WORKSPACE ====="
          find workspace -type f | sort

      - name: Inspect generated API metadata
        run: |
          echo "===== GENERATED API ====="
          find workspace/api -type f | sort

          echo
          echo "===== STORAGE METADATA REFERENCES ====="
          grep -R "ICalculator\|JLib.Tools" workspace/api || true

          echo
          echo "===== MESSAGING METADATA REFERENCES ====="
          grep -R "ICalculator\|JLib.Tools" workspace/api || true

      - name: Resolve dependency xrefmaps
        run: |
          python - <<'PY'
          import os
          import yaml

          xrefs = set()

          contributors_dir = "workspace/contributors"

          for contributor in os.listdir(contributors_dir):
              contributor_path = os.path.join(contributors_dir, contributor)

              if not os.path.isdir(contributor_path):
                  continue

              manifest_path = os.path.join(contributor_path, "manifest.yml")

              if not os.path.exists(manifest_path):
                  continue

              print(f"Reading manifest: {manifest_path}")

              with open(manifest_path) as f:
                  manifest = yaml.safe_load(f) or {}

              for dependency in manifest.get("dependencies", []):
                  xref = dependency.get("xref")

                  if xref:
                      xrefs.add(xref)

          print("===== RESOLVED XREFMAPS =====")

          for xref in sorted(xrefs):
              print(xref)

          if xrefs:
            xref_args = " ".join(f'--xref "{xref}"' for xref in sorted(xrefs))
          else:
            xref_args = ""

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"XREF_ARGS={xref_args}\n")
          PY

      - name: Inspect xref map list
        run: |
          echo "XREF_ARGS = $XREF_ARGS"


      - name: Build documentation site
        working-directory: workspace
        run: docfx build docfx.json $XREF_ARGS

      - name: Inspect generated links
        run: |
          echo "===== SEARCH GENERATED HTML FOR ICALCULATOR ====="
          grep -R -i "ICalculator\|JLib.Tools" workspace/_site || true

      - name: Show generated site
        run: |
          echo "===== GENERATED SITE ====="
          find workspace/_site -type f | sort

      - name: Publish documentation to Azure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
              --destination '$web' \
              --destination-path "services-docs/${{ env.DOC_VERSION }}" \
              --source 'workspace/_site' \
              --overwrite